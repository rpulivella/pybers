# Checks develop after something lands on it: a pull request the preflight saw
# only against an older develop, or an administrator's direct push it never saw.
# It posts nothing and gates nothing; its verdict is the commit's mark and the
# README's badge.
name: health

on:
  push:
    branches: [develop]
  workflow_dispatch:

# A newer push supersedes a run in progress, but a canceled run would read as a
# verdict on the badge, so each run finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    # A run measures in single-digit minutes, and the runner default of 360 would
    # put one hung job past a third of a free plan's monthly allowance.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/gates
        with:
          title: Health
