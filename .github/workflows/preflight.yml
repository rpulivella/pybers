# Runs the same gates a contributor runs locally, on a machine that is not
# theirs. Whether a cold install passes at the declared version is the one thing
# a local run cannot answer, which is what earns this its runtime. See #5.
name: preflight

on:
  pull_request:
    branches: [develop]
    # `ready_for_review` fires this the moment a pull request leaves draft, so a
    # branch is covered without any draft run.
    types: [opened, synchronize, reopened, ready_for_review]
  # No push to develop: a pull request merges only once this is green, so a run
  # after the merge could only report what is already known.

# Pushing three commits in a row cancels the two superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    # A draft skips rather than runs: the same preflight already ran on the
    # developer's machine, a draft cannot merge, and a skipped job costs nothing.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # A run measures in single-digit minutes, and the runner default of 360 would
    # put one hung job past a third of a free plan's monthly allowance.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # The facts below read this branch's log and its diff against the base,
          # and a shallow checkout carries neither.
          fetch-depth: 0

      - name: Fetch the base branch the facts compare against
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-python@v6
        with:
          # One interpreter, the one `requires-python` declares. Naming no
          # version here keeps the claim in a single place, so raising the floor
          # needs no edit to this file.
          python-version-file: pyproject.toml

      - name: Install the project
        run: pip install -e ".[dev]"

      - name: Run the preflight
        # `pipefail` because the default shell reports the exit code of `tee`.
        shell: bash -o pipefail -e {0}
        run: python scripts/pr-preflight-check.py 2>&1 | tee "$RUNNER_TEMP/preflight.log"

      - name: Collect the facts the report needs
        # Always, because a failed gate is exactly what the report exists to show.
        if: always()
        run: |
          python scripts/merge-readiness.py collect \
            --pull-request ${{ github.event.pull_request.number }} \
            --base origin/${{ github.event.pull_request.base.ref }} \
            --branch ${{ github.event.pull_request.head.ref }} \
            --head-sha ${{ github.event.pull_request.head.sha }} \
            --preflight-log "$RUNNER_TEMP/preflight.log" \
            --output merge-readiness.json

      - name: Hand the facts to the reporting half
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: merge-readiness
          path: merge-readiness.json
          retention-days: 1

      - name: Summarize the gates
        # A verdict is matched by its two-space column rather than by any gate
        # name, because a failing checker prints its own `FAIL (1)` header and
        # AC 3 forbids this file from carrying a copy of the gate list.
        if: always()
        run: |
          {
            echo "### Preflight · Python $(python -V | cut -d' ' -f2)"
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            gates=$(grep -E '^(PASS|FAIL) [^ ]+  ' "$RUNNER_TEMP/preflight.log" || true)
            if [ -z "$gates" ]; then
              echo '| none | ❌ the preflight printed no gate lines |'
            else
              echo "$gates" | sed -E 's/^PASS ([^ ]+)  (.*)$/| \1 | ✅ \2 |/; s/^FAIL ([^ ]+)  (.*)$/| \1 | ❌ \2 |/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
