# The posting half of PYB-76, and the only automation in this repository that
# writes. A workflow reached by `workflow_run` checks out the default branch, and
# what the branch produced arrives as an artifact, which a fork can fill with
# anything. So it is unpacked outside the checkout and read as data only: the
# comment is rendered here, and posted only to the pull request whose head is the
# commit the run checked.
#
# readiness.yml decides the verdict, and Actions reports that workflow as its own
# check. Nothing here decides anything.
name: merge readiness

on:
  workflow_run:
    workflows: [readiness]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  post:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install what posting needs
        # `rich` alone: this half imports no part of the library.
        run: pip install rich

      - name: Take what the checking job rendered
        id: rendered
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: merge-readiness
          # Outside the checkout, so nothing in it can stand in for this
          # repository's own code.
          path: ${{ runner.temp }}/readiness
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A draft, or a run that never reached the checking job, rendered nothing,
      # and a comment about a report that does not exist would say nothing.
      - name: Post the report
        if: steps.rendered.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python scripts/merge-readiness.py report \
            --results "$RUNNER_TEMP/readiness/merge-readiness.json" \
            --head-sha "$HEAD_SHA"
