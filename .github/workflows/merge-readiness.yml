# The posting half of PYB-76, and the only automation in this repository that
# writes. A workflow reached by `workflow_run` checks out the default branch, so
# this runs no branch code, and what the branch produced arrives as an artifact.
#
# readiness.yml decides the verdict, and Actions reports that workflow as its own
# check. Nothing here decides anything.
name: merge readiness

on:
  workflow_run:
    workflows: [readiness]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  post:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install what posting needs
        # `rich` alone: this half imports no part of the library.
        run: pip install rich

      - name: Take what the checking job rendered
        id: rendered
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: merge-readiness
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A draft, or a run that never reached the checking job, rendered nothing,
      # and a comment about a report that does not exist would say nothing.
      - name: Post the report
        if: steps.rendered.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/merge-readiness.py report \
            --results merge-readiness.json --comment merge-readiness.md
