# The checking half of PYB-76, and its own workflow so GitHub reports it as its
# own check: a job inside preflight.yml would read as "preflight / readiness",
# which says the preflight failed when it did not.
#
# It runs this branch's code and holds no write access. It hands its results on as
# data, and merge-readiness.yml renders and posts the comment with the default
# branch's code. A value the branch controls reaches a `run:` step through `env:`
# only, so a branch name is never read as shell.
name: readiness

on:
  pull_request:
    branches: [develop]
    # `edited` as well, because the template, the checklist and the CHANGELOG
    # checks read the body, so an edited body can change this verdict.
    types: [opened, synchronize, reopened, ready_for_review, edited]

# Keyed by draft too, so a late draft run cannot cancel the run promotion fired.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read
  # Reading the preflight's own check, and the pull request this reports on.
  checks: read
  pull-requests: read

jobs:
  readiness:
    # A draft skips, like the preflight, and GitHub shows the skip.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # The facts read this branch's log and its diff against the base, and a
          # full checkout fetches every branch, the base included.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install the project
        # The whole project, because one check asks what a fresh install resolves,
        # and an install of `rich` alone would answer for `rich` alone.
        run: pip install -e ".[dev]"

      - name: Collect this branch's facts
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m tools.local.merge_readiness collect \
            --pull-request "$PULL_REQUEST" \
            --base "origin/$BASE_REF" \
            --branch "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --output merge-readiness.json

      - name: Check merge readiness
        # A red verdict fails this step, which is the check a merge is refused on.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m tools.local.merge_readiness check \
            --results merge-readiness.json --comment merge-readiness.md

      - name: Hand the results to the posting half
        # Always, because a red report is the one most worth posting. Data only: the
        # posting half renders the comment itself.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: merge-readiness
          path: merge-readiness.json
          retention-days: 1
