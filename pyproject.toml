[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybers"
version = "0.1.0"
description = "A clean, round-trip-tested Python library for reading and writing Apple Numbers documents."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Richard P Ulivella", email = "pybers@richardulivella.com" },
]
dependencies = [
    # Required at import time, not merely to build: every module in pybers/_generated
    # imports google.protobuf and calls ValidateProtobufRuntimeVersion, which raises
    # VersionError when the runtime is older than the gencode stamped into those
    # modules (6.32.1, from protoc 32.1). That is the version below which this
    # provably cannot work, and it is NOT the floor declared here. The floor is the
    # oldest version the suite has actually been run against, which is higher, and
    # re-running scripts/protos-extract.py with a newer protoc can only raise the
    # mechanical minimum toward it. The development environment and a clean install
    # both run 7.36.1, so one number covers both rather than the manifest allowing
    # a version nobody exercises.
    "protobuf>=7.36.1",
]

# PEP 639 SPDX expression rather than a "License ::" classifier, which that PEP
# deprecates. NOTICE ships alongside LICENSE because Apache-2.0 section 4(d) requires
# a derived work to carry it forward.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
# rich and rich_argparse are for scripts/, not for the library. pybers itself must
# never import them, which the library-purity check enforces. Declared here so that
# one `pip install -e ".[dev]"` equips the venv for both the test suite and the repo
# tooling, rather than the tooling depending on whatever the system interpreter
# happens to carry. Both are also installed system-wide on this developer's machine
# and the scripts run fine there; this makes the venv self-sufficient as well, so a
# fresh clone needs one command and neither environment has to be reasoned about.
dev = [
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "rich_argparse>=1.8.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "types-protobuf>=7.35.1.20260827",
    # `build` rather than `hatchling`: the backend belongs in [build-system] requires,
    # where pip installs it into an isolated environment on its own. This is the
    # front end that drives it, and without it `python3 -m build --wheel` depends on
    # whatever the machine happens to carry.
    "build>=1.6.0",
]

[tool.pybers]
# The ticket key. Declared here because this is the file that already names the
# project, and read by scripts/ticket.py so that one edit moves the key everywhere
# the tools print it. README.md and CLAUDE.md restate it for a human reading the
# repository; neither owns it.
ticketPrefix = "PYB"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/pybers"]

# ── Generated code is excluded from every quality tool ─────────────────────────
# src/pybers/_generated/ is protoc output and src/pybers/protos/ is the schema dump
# it came from. Neither is authored here, neither may be hand-edited (a correction
# would be destroyed by the next extraction), and both would otherwise drown any
# real finding in thousands of machine-written lines. Configured ahead of the tools
# themselves so that adding a linter later cannot accidentally adopt them.
[tool.ruff]
extend-exclude = ["src/pybers/_generated", "src/pybers/protos"]

[tool.ruff.lint]
# Six sets, each earning its place on this codebase rather than chosen by habit.
# Measured 2026-09-02 on the tree as it stood: F found a test defined twice and two
# unused imports, B found ten `zip()` calls that truncate in silence, E found 84
# over-long lines nothing had been checking.
#
#   F    pyflakes: unused imports, undefined names, a value assigned and never read.
#        The set closest to finding real mistakes rather than style.
#   E    pycodestyle errors, which is mostly E501 line-too-long at the 88 columns
#        this repository already writes to by hand.
#   I    import ordering, entirely mechanical and entirely auto-fixable.
#   UP   syntax a supported Python makes obsolete, which enforces the CLAUDE.md
#        rule about `list[str]` over `typing.List` rather than leaving it to review.
#   B    bugbear: mutable default arguments, loop variables captured by a closure,
#        and `zip()` without `strict=`, which silently drops the tail of the longer
#        argument, which is the silent-wrongness this format specializes in.
#   SIM  simpler equivalents for constructs that read as more than they are.
#
# NOT selected, and why, so nobody adds them thinking it was an oversight:
#
#   N    pep8-naming demands snake_case and this repository uses camelCase
#        deliberately (see CLAUDE.md, "House style"). It reported 752 violations,
#        which is the whole set firing on almost every function. Half-disabling it
#        by ignoring N802/N803/N806 leaves something that reads as an accident.
#   ANN  missing-annotation rules duplicate what mypy already checks here.
#   D    pydocstyle enforces a docstring shape this repository does not use: the
#        house form is a one-line imperative summary and free-form why, with no
#        `Args:` or `Returns:` sections.
select = ["F", "E", "I", "UP", "B", "SIM"]

[tool.mypy]
# Strict on the library, because it already carries full type hints and the
# measurement showed strict costing five errors more than default. Loose settings
# would be describing this codebase inaccurately.
strict = true
exclude = ["^src/pybers/_generated/", "^src/pybers/protos/"]
# Both trees are checked by a bare `mypy`, so nobody has to remember two commands
# and CI runs one line.
files = ["src/pybers", "scripts"]

[[tool.mypy.overrides]]
# The generated protobuf modules build their classes at import time through the
# descriptor pool, so mypy sees a module with no attributes and reported 53 errors
# for uses that are perfectly correct. `protoc --mypy_out` now writes a `.pyi`
# beside each one, so those uses are checked properly rather than silenced.
#
# Measured 2026-09-02, and this is why the stubs are worth their 3.1 MB: with them,
# `root.sheetz` fails as `"DocumentArchive" has no attribute "sheetz"; maybe
# "sheets"?`. Told to skip the import instead, that line passes, and a mistyped
# field is exactly the failure this format answers with a plausible wrong number.
#
# The stubs themselves are machine output and are not checked, the same way the
# modules beside them are not.
module = "pybers._generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
# `ruff` ships no py.typed marker, because its Python package is a shim around a
# Rust binary rather than a library. Nothing is being silenced: there are no types
# to check, and `find_ruff_bin()` returning a path is the whole of its surface.
module = "ruff.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Repository tooling, checked but not held to the library's standard. AC 7 of #4 is
# why it is checked at all: two calls in `scripts/pr.py` whose arguments did not
# match the signature sat undiscovered until a real pull request ran one of them,
# and that is a call-signature check rather than a strictness one.
#
# `scripts/` has no `__init__.py`, so mypy names each file by its stem rather than
# as a package. Matching on `scripts.*` silently matched nothing.
module = ["pr", "ticket", "standards-check", "protos-extract"]
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
