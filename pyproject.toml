[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybers"
version = "0.1.0"
description = "A clean, round-trip-tested Python library for reading and writing Apple Numbers documents."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Richard P Ulivella", email = "rpulivella@icloud.com" },
]
dependencies = []

# License is intentionally undecided — see CLAUDE.md. Not set here until chosen.

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/pybers"]
