# How Numbers makes 102-bands-base: a table of 2 header rows, 2 header columns, 5 body
# rows and 1 footer row, its columns holding no fill, a stated No Fill, a color, a color
# then No Fill and a gradient, and a table with no headers, each awaiting Alternating
# Row Color. Made by `.venv/bin/python3 -m tools.local.golden_confirm measure 102-bands-base`.

base = "00-baseline"
document = 0
sheet = "Sheet 1"
table = "Table 1"


[[step]]
action = "tableExtend"
range = "G8"

[[step]]
action = "tableHeadersSet"
setting = "header row count"
value = "2"

[[step]]
action = "tableHeadersSet"
setting = "header column count"
value = "2"

[[step]]
action = "tableHeadersSet"
setting = "footer row count"
value = "1"

[[step]]
