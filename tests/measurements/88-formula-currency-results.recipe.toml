# How Numbers makes 88-formula-currency-results: a euro amount in A1 and a dollar
# amount in B1, then formulas over them and the currency functions, to measure how a
# formula's currency result is stored for PYB-220's AC 3. Made by `.venv/bin/python3
# -m tools.local.golden_confirm measure 88-formula-currency-results`.

base = "00-baseline"

[[step]]
action = "tableExtend"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "I2"

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "A1"
value = '1234.5'

[[step]]
action = "dataFormatSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "A1"
setting = 'Data Format'
value = 'Currency'

[[step]]
action = "dataFormatSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "A1"
setting = 'Currency'
value = 'Euro (€)'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "A2"
value = 'input as 1234.5, Currency Euro'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "B1"
value = '100'

[[step]]
action = "dataFormatSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "B1"
setting = 'Data Format'
value = 'Currency'

[[step]]
action = "dataFormatSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "B1"
setting = 'Currency'
value = 'US Dollar ($)'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "B2"
value = 'input as 100, Currency US Dollar'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "C1"
value = '=A1*2'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "C2"
value = 'input as =A1*2'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "D1"
value = '=SUM(A1,A1)'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "D2"
value = 'input as =SUM(A1,A1)'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "E1"
value = '=A1+10'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "E2"
value = 'input as =A1+10'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "F1"
value = '=A1+B1'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "F2"
value = 'input as =A1+B1'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "G1"
value = '=A1/B1'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "G2"
value = 'input as =A1/B1'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "H1"
value = '=CURRENCYCONVERT(100,"USD","EUR")'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "H2"
value = 'input as =CURRENCYCONVERT(100,"USD","EUR")'

[[step]]
action = "valueSet"
