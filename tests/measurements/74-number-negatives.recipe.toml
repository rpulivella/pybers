# How Numbers makes 74-number-negatives: each negative style on a number, the
# separator on a number, and the red styles on a currency and a percentage, to
# measure `negative_style` and `show_thousands_separator` for PYB-219's AC 4. The
# menu titles both parenthesized styles (100), so `#2` names the red one. Made by
# `.venv/bin/python3 -m tools.local.golden_confirm measure 74-number-negatives`.

base = "00-baseline"

[[step]]
action = "tableExtend"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "H2"

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "A1"
value = '-1234.5'

[[step]]
action = "dataFormatSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "A1"
setting = 'Data Format'
value = 'Number'

[[step]]
action = "dataFormatSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "A1"
setting = 'Decimals'
value = '2'

[[step]]
action = "dataFormatSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "A1"
setting = 'Unlabeled PopUpButton 1'
value = '-100'

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "A2"
value = 'input as -1234.5, Number, 2 decimals, negatives -100'

