# How Numbers makes 107-font-bold-italic: Lorem ipsum in one font per column, then
# Format > Font > Italic or Bold over the whole cell, beside two italic fonts set directly,
# so the file shows whether Numbers chooses the typeface's own font or synthesizes one.
# Headers are removed first, since a header's bold would confound the bold entries. Made by
# `.venv/bin/python3 -m tools.local.golden_confirm measure 107-font-bold-italic`.

base = "00-baseline"
# Exported as a PDF too, to read which font each run embeds, never its text.
pdf = true
document = 0
sheet = "Sheet 1"
table = "Table 1"

[[step]]
action = "tableExtend"
range = "K2"

[[step]]
action = "tableHeadersSet"
setting = "header row count"
value = "0"

[[step]]
action = "tableHeadersSet"
setting = "header column count"
value = "0"

[[step]]
action = "tableHeadersSet"
setting = "footer row count"
value = "0"

[[step]]
action = "valueSet"
range = "A1"
value = "Lorem ipsum"

[[step]]
action = "fontSet"
range = "A1"
value = "AvenirNext-UltraLight"

[[step]]
action = "select"
range = "A1"

[[step]]
action = "menuPress"
menuItem = "italic"

[[step]]
action = "labelSet"
range = "A2"
value = "input as Lorem ipsum, font AvenirNext-UltraLight set through AppleScript, Format > Font > Italic"

