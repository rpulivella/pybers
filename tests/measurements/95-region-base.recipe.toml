# How Numbers makes 95-region-base: a document under en_US, row 1 holding a number, two
# currencies, a date, a percentage and formulas whose text or cached value depends on the
# region, row 2 saying what each was input as, and L left empty, the origin PYB-272
# changes the Language & Region of. Made by `.venv/bin/python3 -m
# tools.local.golden_confirm measure 95-region-base`.

