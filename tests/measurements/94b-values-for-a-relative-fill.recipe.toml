# How Numbers makes 94b-values-for-a-relative-fill: a sum over three numbers beside three empty cells over their own numbers, for a fill that keeps relative positions, each labeled beneath. Made by
# `.venv/bin/python3 -m tools.local.golden_confirm measure 94b-values-for-a-relative-fill`.

base = "00-baseline"
document = 0
sheet = "Sheet 1"
table = "Table 1"

[[step]]
action = "tableExtend"
range = "D5"

[[step]]
action = "valueSet"
range = "A1"
value = "=SUM(A3:A5)"

[[step]]
action = "valueSet"
range = "A2"
value = "formula =SUM(A3:A5)"

[[step]]
action = "valueSet"
range = "B2"
value = "nothing"

[[step]]
action = "valueSet"
range = "C2"
value = "nothing"

