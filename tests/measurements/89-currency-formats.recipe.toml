# How Numbers makes 89-currency-formats: one amount under each currency format
# `12-number-currency` covers, each labeled with what was typed and chosen, then a
# column left empty, for PYB-220's golden to write into. Made by `.venv/bin/python3
# -m tools.local.golden_confirm measure 89-currency-formats`.

base = "00-baseline"

[[step]]
action = "tableExtend"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "J2"

[[step]]
action = "valueSet"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "A1"
value = '1234.5'

[[step]]
