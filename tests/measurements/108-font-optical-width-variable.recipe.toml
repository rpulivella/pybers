# How Numbers makes 108-font-optical-width-variable: Lorem ipsum in one font per column,
# fonts that one typeface, weight and slant do not choose alone: Adobe Jenson Pro's optical
# sizes at one weight, a condensed width, and SF Pro's named instances. Made by
# `.venv/bin/python3 -m tools.local.golden_confirm measure 108-font-optical-width-variable`.

base = "00-baseline"
document = 0
sheet = "Sheet 1"
table = "Table 1"

[[step]]
action = "tableExtend"
range = "I2"

[[step]]
action = "tableHeadersSet"
setting = "header row count"
value = "0"

[[step]]
action = "tableHeadersSet"
setting = "header column count"
value = "0"

[[step]]
action = "tableHeadersSet"
setting = "footer row count"
value = "0"

[[step]]
action = "valueSet"
range = "A1"
value = "Lorem ipsum"

[[step]]
action = "fontSet"
range = "A1"
value = "AJensonPro-Regular"

[[step]]
action = "labelSet"
range = "A2"
value = "input as Lorem ipsum, font AJensonPro-Regular set through AppleScript: Adobe Jenson Pro Regular, the text optical size"

