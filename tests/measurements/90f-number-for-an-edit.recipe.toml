# How Numbers makes 90f-number-for-an-edit: one number, for a number to be written over, each labeled beneath with what it
# holds. Made by `.venv/bin/python3 -m tools.local.golden_confirm measure 90f-number-for-an-edit`.

base = "00-baseline"
document = 0
sheet = "Sheet 1"
table = "Table 1"

[[step]]
action = "tableExtend"
range = "A2"

[[step]]
action = "valueSet"
range = "A1"
value = "1234.5"

[[step]]
action = "valueSet"
range = "A2"
value = "number 1234.5"
