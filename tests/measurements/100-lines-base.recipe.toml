# How Numbers makes 100-lines-base: the labels for cell borders at each position and line style, and one table per table-level line control, each awaiting the change its label specifies. Made by
# `.venv/bin/python3 -m tools.local.golden_confirm measure 100-lines-base`, then 1 header row, 1 header column and 1 footer row set by hand on every table after `Positions Bottom`.

base = "00-baseline"
document = 0
sheet = "Sheet 1"
table = "Table 1"

[[step]]
action = "tableExtend"
range = "G2"

[[step]]
action = "valueSet"
range = "A1"
value = "1"

[[step]]
action = "valueSet"
range = "A2"
value = "input as 1, Border Outline, solid line chosen from the No Border menu, width and color left as offered"

[[step]]
