# How Numbers makes 75-fraction-accuracy: 1.3141 in each column, given one choice from
# the Fraction accuracy menu, in the order the menu lists them, to measure
# `fraction_accuracy` for PYB-219's AC 4. Made by `.venv/bin/python3 -m
# tools.local.golden_confirm measure 75-fraction-accuracy`.

base = "00-baseline"

