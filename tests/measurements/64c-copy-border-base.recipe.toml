# How Numbers made 64c-copy-border-base: `61-move-styles-base`, which holds a border
# around C3, with `C3` copied and pasted at `G9`, so G9 holds 32 inside a border of its
# own. Made by `python3 scripts/golden-confirm.py measure 64c-copy-border-base`.

base = "61-move-styles-base"

[[step]]
action = "select"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "C3"

[[step]]
action = "menuPress"
document = 0
menuItem = "copy"

[[step]]
action = "select"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "G9"

[[step]]
action = "menuPress"
document = 0
menuItem = "paste"
