# How Numbers makes 90d-values-for-literal-text: two numbers and an empty cell, for literal and ordinary text to be written over, each labeled beneath with what it
# holds. Made by `.venv/bin/python3 -m tools.local.golden_confirm measure 90d-values-for-literal-text`.

base = "00-baseline"
document = 0
sheet = "Sheet 1"
table = "Table 1"

[[step]]
action = "tableExtend"
range = "C2"

[[step]]
action = "valueSet"
range = "A1"
value = "1234.5"

[[step]]
action = "valueSet"
range = "A2"
value = "number 1234.5"

[[step]]
action = "valueSet"
range = "B1"
value = "42"

[[step]]
action = "valueSet"
range = "B2"
value = "number 42"

[[step]]
action = "valueSet"
range = "C2"
value = "nothing"
