# How Numbers made 64f-copy-onto-empty-border: `64e-copy-border-emptied` with `B2:D5`
# copied and pasted at `E8`, so `D3`, which has no border, lands on `G9`, empty inside
# its border, and the bordered `C3` lands on `F9`. Made by
# `python3 scripts/golden-confirm.py measure 64f-copy-onto-empty-border`.

base = "64e-copy-border-emptied"

[[step]]
action = "select"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "B2:D5"

[[step]]
action = "menuPress"
document = 0
menuItem = "copy"

[[step]]
action = "select"
document = 0
sheet = "Sheet 1"
table = "Table 1"
range = "E8"

[[step]]
action = "menuPress"
document = 0
menuItem = "paste"
